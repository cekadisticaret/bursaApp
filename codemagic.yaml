workflows:
  bursaapp-ios-testflight:
    name: BursaApp iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: mobile
    integrations:
      app_store_connect: bursaapp
    environment:
      groups:
        - code_signing
      vars:
        BUNDLE_ID: com.bursaapp.mobile
      flutter: stable
      xcode: latest
    scripts:
      - name: Bootstrap Flutter platforms
        script: |
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create . --org com.bursaapp --project-name mobile --platforms=ios,android
          fi
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.bursaapp.mobile;/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Yakınındaki mekanları haritada göstermek için konum kullanılır.'" ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'Yakınındaki mekanları haritada göstermek için konum kullanılır.'" ios/Runner/Info.plist
      - name: Dependencies
        script: flutter pub get
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          set -e
          # Önce mevcut distribution sertifikalarını indir; private key eşleşirse kullanılır
          app-store-connect certificates list --type IOS_DISTRIBUTION --save || true
          if ! app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --verbose; then
            echo ""
            echo "IMZA HATASI:"
            echo "1) CERTIFICATE_PRIVATE_KEY mevcut 3 Distribution sertifikasından biriyle eşleşmiyor"
            echo "2) Apple en fazla 3 Distribution sertifikasına izin verir (409 = kota dolu)"
            echo ""
            echo "Çözüm A: developer.apple.com → Certificates → kullanılmayan 1 Distribution sertifikasını Revoke → rebuild"
            echo "Çözüm B: Mevcut sertifikaya ait private key'i CERTIFICATE_PRIVATE_KEY olarak Codemagic'e yapıştır"
            exit 1
          fi
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Analyze
        script: flutter analyze
      - name: Build IPA
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
