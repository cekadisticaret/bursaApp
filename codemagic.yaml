workflows:
  bursaapp-ios-native:
    name: BursaApp iOS Native (SwiftUI)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: mobile-ios
    integrations:
      app_store_connect: bursaapp
    environment:
      vars:
        BUNDLE_ID: com.bursaapp.mobile
        APP_STORE_APPLE_ID: "6809813024"
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - bursaapp_appstore
        certificates:
          - bursaapp_dist
    scripts:
      - name: Install XcodeGen
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Resolve iOS build number
        script: |
          set -e
          eval "$(bash scripts/ios_resolve_build.sh resolve project.yml | sed 's/^/export IOS_/')"
          echo "App Store=$IOS_asc_latest · TestFlight=$IOS_tf_latest · local=+$IOS_local_build · son=$IOS_store_latest · YENİ=+$IOS_next_build"
          bash scripts/ios_resolve_build.sh apply "$IOS_version_name" "$IOS_next_build" project.yml
          echo "$IOS_version_name" > .ios_version_name
          echo "$IOS_next_build" > .ios_build_number
          grep CURRENT_PROJECT_VERSION project.yml
      - name: Generate Xcode project
        script: |
          set -e
          xcodegen generate
          VERSION_NAME=$(cat .ios_version_name)
          BUILD_NUMBER=$(cat .ios_build_number)
          bash scripts/ios_resolve_build.sh apply-pbxproj "$VERSION_NAME" "$BUILD_NUMBER"
          grep CURRENT_PROJECT_VERSION BursaApp.xcodeproj/project.pbxproj | head -3
          ls -la BursaApp.xcodeproj
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          if [ ! -f "$HOME/export_options.plist" ]; then
            echo "HATA: export_options.plist yok."
            exit 1
          fi
          echo "✓ export_options.plist hazır"
      - name: Build IPA
        script: |
          set -e
          VERSION_NAME=$(cat .ios_version_name)
          BUILD_NUMBER=$(cat .ios_build_number)
          bash scripts/ios_resolve_build.sh apply-pbxproj "$VERSION_NAME" "$BUILD_NUMBER"
          xcode-project build-ipa \
            --project BursaApp.xcodeproj \
            --scheme BursaApp \
            --archive-flags "MARKETING_VERSION=$VERSION_NAME CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
          bash scripts/ios_resolve_build.sh verify-build "$BUILD_NUMBER"
          mkdir -p artifacts
          IPA="build/ios/ipa/BursaApp.ipa"
          if [ ! -f "$IPA" ]; then IPA=$(find build/ios/ipa -name '*.ipa' | head -1); fi
          cp "$IPA" artifacts/
          ls -la artifacts/ build/ios/ipa/
      - name: Upload to App Store Connect
        script: |
          set -e
          BUILD_NUMBER=$(cat .ios_build_number)
          ASC=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          STORE_LATEST=0
          for v in "$ASC" "$TF"; do
            if [[ "$v" =~ ^[0-9]+$ ]] && [ "$v" -gt "$STORE_LATEST" ]; then STORE_LATEST=$v; fi
          done
          IPA="artifacts/BursaApp.ipa"
          if [ ! -f "$IPA" ]; then IPA=$(find artifacts build/ios/ipa -name '*.ipa' 2>/dev/null | head -1); fi
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then echo "HATA: IPA yok"; exit 1; fi
          IPA_BUILD=$(bash scripts/ios_resolve_build.sh ipa-build "$IPA")
          echo "Store son=$STORE_LATEST · hedef=$BUILD_NUMBER · IPA CFBundleVersion=$IPA_BUILD · dosya=$IPA"
          if [ "$IPA_BUILD" != "$BUILD_NUMBER" ]; then
            echo "HATA: IPA build $IPA_BUILD != $BUILD_NUMBER"
            exit 1
          fi
          if [ "$IPA_BUILD" -le "$STORE_LATEST" ]; then
            echo "HATA: build $IPA_BUILD zaten App Store'da (son=$STORE_LATEST)"
            exit 1
          fi
          if bash scripts/ios_resolve_build.sh should-upload "$IPA_BUILD" "$STORE_LATEST"; then
            app-store-connect publish --path "$IPA"
            echo "✓ Native IPA yüklendi (build $IPA_BUILD)"
          else
            echo "✓ Upload atlandı"
          fi
    artifacts:
      - artifacts/*.ipa
      - build/**/*.ipa

  bursaapp-ios-testflight:
    name: BursaApp iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: mobile
    integrations:
      app_store_connect: bursaapp
    environment:
      vars:
        BUNDLE_ID: com.bursaapp.mobile
        APP_STORE_APPLE_ID: "6809813024"
      flutter: stable
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - bursaapp_appstore
        certificates:
          - bursaapp_dist
    scripts:
      - name: Bootstrap Flutter platforms
        script: |
          set -e
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create . --org com.bursaapp --project-name mobile --platforms=ios,android
          fi
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.bursaapp.mobile;/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Yakınındaki mekanları haritada göstermek için konum kullanılır.'" ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'Yakınındaki mekanları haritada göstermek için konum kullanılır.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Profil fotoğrafı seçmek için galeri erişimi gerekir.'" ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Profil fotoğrafı seçmek için galeri erişimi gerekir.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string BursaApp" ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName BursaApp" ios/Runner/Info.plist
      - name: Dependencies
        script: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Resolve iOS build number
        script: |
          set -e
          eval "$(bash scripts/ios_resolve_build.sh resolve pubspec.yaml | sed 's/^/export IOS_/')"
          echo "App Store=$IOS_asc_latest · TestFlight=$IOS_tf_latest · pubspec=+$IOS_local_build · son=$IOS_store_latest · YENİ=+$IOS_next_build"
          perl -i -pe "s/^version: .*/version: ${IOS_version_name}+${IOS_next_build}/" pubspec.yaml
          echo "$IOS_version_name" > .ios_version_name
          echo "$IOS_next_build" > .ios_build_number
          grep '^version:' pubspec.yaml
          flutter pub get
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${IOS_next_build};/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = ${IOS_version_name};/g" ios/Runner.xcodeproj/project.pbxproj
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          if [ ! -f "$HOME/export_options.plist" ]; then
            echo "HATA: export_options.plist yok."
            echo "Codemagic → Team → iOS certificates: bursaapp_dist"
            echo "Codemagic → iOS provisioning: bursaapp_appstore"
            echo "Workflow bu repodaki kök codemagic.yaml olmalı (UI script değil)."
            exit 1
          fi
          echo "✓ export_options.plist hazır"
          security find-identity -v -p codesigning | head -5 || true
      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build IPA
        script: |
          set -e
          if [ ! -f "$HOME/export_options.plist" ]; then
            echo "HATA: İmza adımı atlanmış — Build IPA önce 'Set up code signing' çalışmalı."
            exit 1
          fi
          VERSION_NAME=$(cat .ios_version_name)
          BUILD_NUMBER=$(cat .ios_build_number)
          echo "flutter build ipa --build-name=$VERSION_NAME --build-number=$BUILD_NUMBER"
          flutter build ipa --release \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"
          APP_PLIST="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist"
          BUILT=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP_PLIST")
          echo "IPA CFBundleVersion=$BUILT"
          if [ "$BUILT" != "$BUILD_NUMBER" ]; then
            echo "HATA: IPA build numarası $BUILT != $BUILD_NUMBER"
            exit 1
          fi
          mkdir -p artifacts
          cp build/ios/ipa/*.ipa artifacts/
          ls -la build/ios/ipa/ artifacts/
      - name: Upload to App Store Connect
        script: |
          set -e
          BUILD_NUMBER=$(cat .ios_build_number)
          ASC=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          STORE_LATEST=0
          for v in "$ASC" "$TF"; do
            if [[ "$v" =~ ^[0-9]+$ ]] && [ "$v" -gt "$STORE_LATEST" ]; then STORE_LATEST=$v; fi
          done
          IPA=$(find build/ios/ipa -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then echo "HATA: IPA yok"; exit 1; fi
          echo "Build=$BUILD_NUMBER · App Store son=$STORE_LATEST"
          if bash scripts/ios_resolve_build.sh should-upload "$BUILD_NUMBER" "$STORE_LATEST"; then
            # Yalnızca IPA yükle — --testflight beta review ASC metadata ister, CI'ı gereksiz kırmızı yapar
            app-store-connect publish --path "$IPA"
            echo "✓ IPA yüklendi (build $BUILD_NUMBER). TestFlight grubuna ASC'den elle ata."
          else
            echo "✓ Upload atlandı — build $BUILD_NUMBER zaten App Store Connect'te."
          fi
          echo "TestFlight: https://appstoreconnect.apple.com/apps/$APP_STORE_APPLE_ID/testflight/ios"
    artifacts:
      - build/ios/ipa/*.ipa
      - artifacts/*.ipa
    # publishing bloğu KALDIRILDI — çift upload / Retry 90189 önlenir; upload yukarıdaki script'te
