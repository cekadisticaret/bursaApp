workflows:
  bursaapp-ios-testflight:
    name: BursaApp iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: mobile
    integrations:
      app_store_connect: bursaapp
    environment:
      vars:
        BUNDLE_ID: com.bursaapp.mobile
        APP_STORE_APPLE_ID: "6809813024"
      flutter: stable
      xcode: latest
      # Codemagic UI → Code signing identities (reference name'ler birebir)
      ios_signing:
        provisioning_profiles:
          - bursaapp_appstore
        certificates:
          - bursaapp_dist
    scripts:
      - name: Bootstrap Flutter platforms
        script: |
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create . --org com.bursaapp --project-name mobile --platforms=ios,android
          fi
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.bursaapp.mobile;/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Yakınındaki mekanları haritada göstermek için konum kullanılır.'" ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'Yakınındaki mekanları haritada göstermek için konum kullanılır.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Profil fotoğrafı seçmek için galeri erişimi gerekir.'" ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Profil fotoğrafı seçmek için galeri erişimi gerekir.'" ios/Runner/Info.plist
      - name: Dependencies
        script: flutter pub get
      - name: Auto increment iOS build number
        script: |
          set -e
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          LOCAL_BUILD=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f2)
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          fi
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            echo "App Store build sorgusu boş — yüklü build 1 varsayılıyor"
            LATEST=1
          fi
          NEXT=$((LATEST + 1))
          if [[ "$LOCAL_BUILD" =~ ^[0-9]+$ ]] && [ "$NEXT" -le "$LOCAL_BUILD" ]; then
            NEXT=$((LOCAL_BUILD + 1))
          fi
          echo "Son App Store build: $LATEST · pubspec: +$LOCAL_BUILD · kullanılacak: +$NEXT"
          perl -i -pe "s/^version: .*/version: ${VERSION_NAME}+${NEXT}/" pubspec.yaml
          grep '^version:' pubspec.yaml
          echo "IOS_VERSION_NAME=$VERSION_NAME" >> "$CM_ENV"
          echo "IOS_BUILD_NUMBER=$NEXT" >> "$CM_ENV"
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
          echo "=== Keychain ==="
          security find-identity -v -p codesigning
          if [ ! -f "$HOME/export_options.plist" ]; then
            echo "export_options.plist oluşmadı"
            exit 1
          fi
      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist="$HOME/export_options.plist"
          mkdir -p artifacts
          cp build/ios/ipa/*.ipa artifacts/ || {
            echo "IPA bulunamadı:"
            find build/ios -type f \( -name "*.ipa" -o -name "*.xcarchive" \) 2>/dev/null || true
            exit 1
          }
          ls -la artifacts/
    artifacts:
      - build/ios/ipa/*.ipa
      - artifacts/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
